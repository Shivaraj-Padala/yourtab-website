<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YourTab — Make every new tab feel like home</title>
    <meta name="description" content="Shortcuts, search, notes, to-dos and games in one place. No account. No tracking." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="theme-color" content="#fbfaf8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- Open Graph / social cards. Set VITE_SITE_URL in .env to make these absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="YourTab" />
    <meta property="og:title" content="YourTab — Make every new tab feel like home" />
    <meta property="og:description" content="Shortcuts, search, notes, to-dos and games in one place. No account. No tracking." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The YourTab logo on an orange-to-pink gradient, with the words: Make every new tab feel like home." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="YourTab — Make every new tab feel like home" />
    <meta name="twitter:description" content="Shortcuts, search, notes, to-dos and games in one place. No account. No tracking." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og.png" />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
